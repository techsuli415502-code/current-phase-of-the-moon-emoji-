<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep night sky gradient background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="60%" stop-color="#0d1024"/>
      <stop offset="100%" stop-color="#06081a"/>
    </radialGradient>
    <!-- Moon body gradient -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="55%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#C9B58D"/>
    </radialGradient>
    <!-- Crescent shadow -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1024" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1024" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFD97A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFD97A" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip path for crescent shape -->
    <clipPath id="moonClip">
      <circle cx="256" cy="256" r="140"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Tiny stars scattered in background -->
  <g fill="#FFF8DC" opacity="0.8">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="120" cy="60" r="1.5"/>
    <circle cx="430" cy="90" r="2.5"/>
    <circle cx="460" cy="140" r="1.5"/>
    <circle cx="90" cy="380" r="1.5"/>
    <circle cx="60" cy="280" r="2"/>
    <circle cx="420" cy="380" r="2"/>
    <circle cx="440" cy="300" r="1.5"/>
    <circle cx="150" cy="430" r="1.5"/>
    <circle cx="370" cy="450" r="2"/>
    <circle cx="100" cy="200" r="1"/>
    <circle cx="400" cy="200" r="1"/>
  </g>

  <!-- Star sparkle highlights (4-pointed stars) -->
  <g fill="#FFF8DC">
    <path d="M 130 180 L 134 188 L 142 192 L 134 196 L 130 204 L 126 196 L 118 192 L 126 188 Z" opacity="0.9"/>
    <path d="M 390 340 L 393 346 L 399 349 L 393 352 L 390 358 L 387 352 L 381 349 L 387 346 Z" opacity="0.8"/>
    <path d="M 400 110 L 402 114 L 406 116 L 402 118 L 400 122 L 398 118 L 394 116 L 398 114 Z" opacity="0.7"/>
  </g>

  <!-- Outer glow halo -->
  <circle cx="256" cy="256" r="200" fill="url(#glowGrad)"/>

  <!-- Full moon disc -->
  <circle cx="256" cy="256" r="140" fill="url(#moonGrad)"/>

  <!-- Crescent shadow (creates the waxing crescent shape) -->
  <g clip-path="url(#moonClip)">
    <circle cx="320" cy="220" r="135" fill="url(#shadowGrad)"/>
  </g>

  <!-- Moon craters (subtle texture) -->
  <g fill="#B5A07A" opacity="0.35">
    <circle cx="220" cy="220" r="12"/>
    <circle cx="200" cy="290" r="8"/>
    <circle cx="240" cy="320" r="6"/>
    <circle cx="180" cy="260" r="5"/>
    <circle cx="260" cy="200" r="4"/>
  </g>

  <!-- Ring of 8 tiny moon phase emojis around the moon (subtle, decorative) -->
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" opacity="0.5">
    <text x="256" y="40">🌑</text>
    <text x="384" y="80">🌒</text>
    <text x="472" y="256">🌓</text>
    <text x="384" y="432">🌔</text>
    <text x="256" y="488">🌕</text>
    <text x="128" y="432">🌖</text>
    <text x="40" y="256">🌗</text>
    <text x="128" y="80">🌘</text>
  </g>
</svg>
